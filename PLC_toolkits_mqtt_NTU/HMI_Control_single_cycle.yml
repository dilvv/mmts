# Web Thermal Cycle template only.
# AutoTest must continue to use HMI_Control.yml and HMI_Control_5cycle.yml.
# Runtime copies may change experiment.idle_cold_min to 10 or 59 minutes.
# This source template must never be modified during operation.
plc:
  ip: 192.168.0.99
  rack: 0
  slot: 1
  db_number: 15

experiment:
  # One independent PLC cycle per web-runner invocation.
  temp_high: 20.0
  temp_low: -40.0
  cycles: 1
  idle_warm_min: 10
  idle_cold_min: 10
  # safety limits copied from the validated thermal configs
  temp_high_limit: 30.0
  temp_low_limit: -50.0

execution:
  dry_run: true

database:
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_USER: plc_user
  DB_NAME: plc_db
  DB_PASSWORD: IHEPhgcal

mqtt:
  MQTT_BROKER: 127.0.0.1
  MQTT_PORT: 1883
  MQTT_TOPIC: plc/s7-1200/temperature
